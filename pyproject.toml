[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesiclenet"
version = "0.1.0"
description = "Reproducible quantitative analysis of vesicles in fluorescence microscopy images"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "VesicleNet contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "tifffile>=2023.7", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4", "coverage>=7.3"]
benchmark = ["pytest-benchmark>=4.0"]

[project.scripts]
vesiclenet = "vesiclenet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["vesiclenet"]
branch = true
